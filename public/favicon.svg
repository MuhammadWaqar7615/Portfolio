<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121318" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>

    <!-- Crimson Brand Accent Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4444" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.2" />
    </linearGradient>

    <!-- Subtle Radial Glow Behind Monogram -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Monogram -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ef4444" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with 120px corner radius -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Ambient Glow in Center -->
  <circle cx="256" cy="260" r="170" fill="url(#centerGlow)" />

  <!-- Geometric Monogram W + Signature Red Dot -->
  <g filter="url(#glow)">
    <!-- Main Titanium White W -->
    <path
      d="M 108 160
         L 174 365
         L 256 228
         L 338 365
         L 404 160"
      fill="none"
      stroke="#fafafa"
      stroke-width="50"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Crimson Accent Inner V (adds depth and branding) -->
    <path
      d="M 198 288
         L 256 384
         L 314 288"
      fill="none"
      stroke="url(#crimsonGrad)"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Signature Crimson Dot (matches Muhammad.) -->
    <circle cx="426" cy="365" r="26" fill="url(#crimsonGrad)" />
  </g>
</svg>