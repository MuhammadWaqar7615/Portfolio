<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Obsidian Cyber Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1c" />
      <stop offset="50%" stop-color="#08090d" />
      <stop offset="100%" stop-color="#13080b" />
    </linearGradient>

    <!-- Dual Rim Border (Preset 1 Cyber Cyan to Preset 2 Crimson Studio) -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#F43F5E" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.9" />
    </linearGradient>

    <!-- Dual Accent Gradient (Preset 1 Cyan -> Violet -> Preset 2 Crimson) -->
    <linearGradient id="dualGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Preset 1 Cyan Ambient Aura (Left) -->
    <radialGradient id="cyanGlow" cx="22%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#00F2FE" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>

    <!-- Preset 2 Crimson Ambient Aura (Right) -->
    <radialGradient id="crimsonGlow" cx="78%" cy="52%" r="52%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#EF4444" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Monogram & Depth -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Squircle Base with Dual Rim -->
  <rect x="10" y="10" width="492" height="492" rx="118" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="8" />

  <!-- Dual Ambient Glow Fields -->
  <circle cx="160" cy="260" r="180" fill="url(#cyanGlow)" />
  <circle cx="352" cy="260" r="180" fill="url(#crimsonGlow)" />

  <g filter="url(#glow)">
    <!-- Main Titanium White Monogram W (High Contrast, Ultra-Crisp Legibility) -->
    <path
      d="M 108 155
         L 174 365
         L 256 225
         L 338 365
         L 404 155"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="52"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Architectural Inner Chevron V (Cyan on Left for Preset 1, Crimson on Right for Preset 2) -->
    <path
      d="M 196 280
         L 256 380
         L 316 280"
      fill="none"
      stroke="url(#dualGrad)"
      stroke-width="40"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Signature Dual-Tone Accent Dot (Matches Muhammad. Dot with Cyan & Crimson Harmony) -->
    <circle cx="428" cy="365" r="28" fill="url(#dualGrad)" />
  </g>
</svg>